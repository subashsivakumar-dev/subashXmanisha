<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#7D2637" />
  <title>Page Not Found — Subash &amp; Manisha Wedding</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --gold:           #D4AF37;
      --gold-light:     #F5E7B2;
      --gold-dark:      #B8931F;
      --gold-pale:      #FFF4D0;
      --burgundy:       #7D2637;
      --burgundy-dark:  #4A131F;
      --ivory:          #FDFBF7;
      --container-max:  480px;
      --font-display:   'Cinzel', serif;
      --font-serif:     'Cormorant Garamond', serif;
      --font-body:      'Montserrat', sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100%;
      min-height: 100vh;
      background-color: #0F060A;
      font-family: var(--font-body);
      color: var(--ivory);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .error-card {
      width: 100%;
      max-width: var(--container-max);
      background-color: #170911;
      background-image:
        linear-gradient(180deg,
          rgba(15, 5, 10, 0.72) 0%,
          rgba(25, 8, 16, 0.65) 40%,
          rgba(10, 3, 7, 0.94) 100%
        ),
        url('assets/images/Golden Mandap by the Misty Lake.png');
      background-size: cover;
      background-position: center;
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 20px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.7), 0 0 40px rgba(212, 175, 55, 0.15);
      padding: 36px 24px;
      text-align: center;
    }

    .error-logo {
      width: 140px;
      max-width: 60%;
      height: auto;
      margin: 0 auto 16px;
      display: block;
      filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.6));
    }

    .error-code {
      font-family: var(--font-display);
      font-size: 42px;
      font-weight: 700;
      color: var(--gold-light);
      letter-spacing: 3px;
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
    }

    .error-title {
      font-family: var(--font-serif);
      font-size: 20px;
      color: var(--gold-pale);
      margin-bottom: 12px;
    }

    .error-desc {
      font-size: 13.5px;
      line-height: 1.6;
      color: rgba(253, 251, 247, 0.85);
      margin-bottom: 24px;
    }

    .links-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn-route {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 18px;
      border-radius: 9999px;
      background: rgba(30, 10, 20, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.6);
      color: var(--gold-light);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      transition: all 0.25s ease;
    }

    .btn-route:hover {
      background: rgba(125, 38, 55, 0.75);
      border-color: var(--gold-light);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
      color: #FFFDF8;
    }

    .btn-main {
      background: linear-gradient(135deg, rgba(125, 38, 55, 0.9), rgba(74, 19, 31, 0.9));
      border-color: var(--gold);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="error-card">
    <img src="assets/images/Subash & Manisha Golden Wedding Logo.png" alt="Subash & Manisha" class="error-logo" />
    <h1 class="error-code">404</h1>
    <h2 class="error-title">Invitation Page Not Found</h2>
    <p class="error-desc">
      The page you are looking for may have moved or doesn't exist. Please choose an invitation below to join the celebration:
    </p>

    <div class="links-list">
      <a href="./" class="btn-route btn-main">✨ Home / Language Selection</a>
      <a href="english/" class="btn-route">English Invitation</a>
      <a href="tamil/" class="btn-route">தமிழ் அழைப்பிதழ் (Tamil)</a>
      <a href="hindi/" class="btn-route">हिंदी निमंत्रण (Hindi)</a>
      <a href="binary/" class="btn-route">01010011 (Binary Edition)</a>
    </div>
  </div>

  <script>
    if (window.location.protocol === 'file:') {
      document.querySelectorAll('a[href$="/"]').forEach(function(a) {
        var href = a.getAttribute('href');
        if (href && !href.startsWith('http') && !href.startsWith('#')) {
          a.setAttribute('href', href + 'index.html');
        }
      });
      var homeBtn = document.querySelector('.btn-main');
      if (homeBtn && homeBtn.getAttribute('href') === './') {
        homeBtn.setAttribute('href', 'index.html');
      }
    }
  </script>
</body>
</html>
